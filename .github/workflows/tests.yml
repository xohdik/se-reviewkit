name: Offline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q slrkit.py claim_audit.py reference_audit.py screening_agreement.py evidence_reconcile.py select_families.py review_calibration.py
      - run: python -m pip install --no-deps .
      - run: se-reviewkit --version
      - run: se-evidence-reconcile --help
      - run: se-select-families --help
